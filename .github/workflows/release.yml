name: Build SuperBLT release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (for example, r76)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: superblt-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out the released revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate tag and mod version
        shell: pwsh
        run: |
          $mod = Get-Content -LiteralPath .\mod.txt -Raw | ConvertFrom-Json
          $expectedTag = "r$($mod.version)"

          if ($env:RELEASE_TAG -ne $expectedTag) {
              throw "Release tag '$env:RELEASE_TAG' does not match mod.txt version '$($mod.version)'. Expected '$expectedTag'."
          }

      - name: Stage the distributable mod
        shell: pwsh
        run: |
          $stageRoot = Join-Path $PWD "release-stage"
          $modRoot = Join-Path $stageRoot "Kyohud"
          $outputRoot = Join-Path $PWD "release-output"
          $excludedFiles = @(
              ".gitattributes",
              ".gitignore",
              "AGENTS.md",
              "CODEX.md",
              "meta.json"
          )

          New-Item -ItemType Directory -Path $modRoot -Force | Out-Null
          New-Item -ItemType Directory -Path $outputRoot -Force | Out-Null

          foreach ($file in (git ls-files)) {
              $normalized = $file.Replace("\", "/")
              if ($normalized.StartsWith(".github/") -or $excludedFiles -contains $normalized) {
                  continue
              }

              $destination = Join-Path $modRoot $normalized
              $destinationDirectory = Split-Path -Parent $destination
              New-Item -ItemType Directory -Path $destinationDirectory -Force | Out-Null
              Copy-Item -LiteralPath $file -Destination $destination
          }

          if (-not (Test-Path -LiteralPath (Join-Path $modRoot "mod.txt"))) {
              throw "The staged archive does not contain mod.txt."
          }

      - name: Build latest.zip and SuperBLT metadata
        shell: pwsh
        run: |
          $modRoot = Join-Path $PWD "release-stage\Kyohud"
          $outputRoot = Join-Path $PWD "release-output"

          $hashOutput = & .\.github\hash.exe $modRoot
          $hashMatch = [regex]::Match(($hashOutput -join "`n"), "[0-9a-fA-F]{64}")
          if (-not $hashMatch.Success) {
              throw "Unable to read the SuperBLT directory hash. Output: $hashOutput"
          }
          $hash = $hashMatch.Value.ToLowerInvariant()

          $metadata = @(
              [ordered]@{
                  ident = "kyohud"
                  hash = $hash
                  patchnotes_url = "https://github.com/Kyosh1ro/kyohud/releases/latest"
                  download_url = "https://github.com/Kyosh1ro/kyohud/releases/latest/download/latest.zip"
              }
          )
          $metadataPath = Join-Path $outputRoot "meta.json"
          ConvertTo-Json -InputObject $metadata -Depth 3 | Set-Content -LiteralPath $metadataPath -Encoding utf8NoBOM

          $generatedMetadata = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $metadataPath -Raw) -NoEnumerate
          if ($generatedMetadata -isnot [array] -or $generatedMetadata.Count -ne 1) {
              throw "SuperBLT metadata must be a JSON array containing exactly one update entry."
          }

          $updateEntry = $generatedMetadata[0]
          if ($updateEntry.ident -ne "kyohud" -or $updateEntry.hash -notmatch "^[0-9a-f]{64}$" -or -not $updateEntry.download_url) {
              throw "Generated SuperBLT metadata is invalid."
          }

          Push-Location .\release-stage
          try {
              & ..\.github\7za.exe a -tzip ..\release-output\latest.zip .\Kyohud
              if ($LASTEXITCODE -ne 0) {
                  throw "7-Zip failed with exit code $LASTEXITCODE."
              }
          }
          finally {
              Pop-Location
          }

      - name: Upload SuperBLT assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload $env:RELEASE_TAG `
              .\release-output\latest.zip `
              .\release-output\meta.json `
              --clobber
